<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Launchpad</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  body { margin:0; font-family:'Segoe UI',Helvetica,Arial,sans-serif; background:#fafafa; }
  #bar { padding:10px 16px; display:flex; gap:18px; align-items:center; border-bottom:1px solid #e5e5e5; background:#fff; }
  #bar h1 { font-size:16px; margin:0; }
  #bar .progress { font-size:14px; color:#2e7d32; font-weight:600; }
  #bar a { font-size:13px; color:#2563eb; text-decoration:none; }
  #bar .spacer { flex:1; }
  #chain { font-size:12px; color:#666; padding:6px 16px; background:#fff; border-bottom:1px solid #eee; display:none; }
  #chart { width:100vw; height:calc(100vh - 74px); }
  .legend { display:flex; gap:10px; font-size:12px; color:#555; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; }
</style>
</head>
<body>
<div id="bar">
  <h1>Launchpad</h1>
  <span class="progress" id="overall"></span>
  <span class="legend">
    <span><i style="background:#2e7d32"></i>done</span>
    <span><i style="background:#f59e0b"></i>in&nbsp;progress</span>
    <span><i style="background:#dc2626"></i>blocked</span>
    <span><i style="background:#9e9e9e"></i>todo</span>
  </span>
  <span class="spacer"></span>
  <input id="search" type="search" placeholder="filter tiles…" style="font-size:13px;padding:4px 8px;border:1px solid #ddd;border-radius:6px;width:180px"/>
  <a href="story-map.excalidraw.md">story map (Excalidraw) →</a>
</div>
<div id="chain"></div>
<div id="chart"></div>
<script>
const MODEL = {"title":"Launchpad","storyMapHref":"story-map.excalidraw.md","overall":{"done":9,"total":16},"data":[{"id":"","label":"All outcomes","parent":"","value":0,"progress":0.5625,"done":9,"total":16,"key":"__root__"},{"id":"o-visual-brain","label":"Fractal visual brain — see everything, lose nothing","parent":"","value":0,"progress":0.625,"done":5,"total":8,"key":"o-visual-brain"},{"id":"c-fractal-recursion","label":"Infinite fractal drill-down","parent":"o-visual-brain","value":0,"progress":0.5,"done":1,"total":2,"key":"c-fractal-recursion"},{"id":"c-fractal-recursion|svc-fractal-index","label":"fractal-index (ea-script)","parent":"c-fractal-recursion","value":0,"progress":0.5,"done":1,"total":2,"key":"c-fractal-recursion|svc-fractal-index"},{"id":"c-multi-view","label":"Multiple projections of one tree","parent":"o-visual-brain","value":0,"progress":0.6666666666666666,"done":2,"total":3,"key":"c-multi-view"},{"id":"c-multi-view|svc-ci","label":"CI + automation","parent":"c-multi-view","value":0,"progress":0,"done":0,"total":1,"key":"c-multi-view|svc-ci"},{"id":"c-multi-view|svc-dual-views","label":"dual-views (generator)","parent":"c-multi-view","value":0,"progress":1,"done":2,"total":2,"key":"c-multi-view|svc-dual-views"},{"id":"c-static-positions","label":"Static-position guarantee","parent":"o-visual-brain","value":0,"progress":0.6666666666666666,"done":2,"total":3,"key":"c-static-positions"},{"id":"c-static-positions|svc-fractal-index","label":"fractal-index (ea-script)","parent":"c-static-positions","value":0,"progress":1,"done":2,"total":2,"key":"c-static-positions|svc-fractal-index"},{"id":"c-static-positions|svc-obsidian-plugin","label":"obsidian-excalidraw-plugin","parent":"c-static-positions","value":0,"progress":0,"done":0,"total":1,"key":"c-static-positions|svc-obsidian-plugin"},{"id":"o-outcome-dev","label":"Outcome-driven development — trace code to JTBD","parent":"","value":0,"progress":0.5,"done":3,"total":6,"key":"o-outcome-dev"},{"id":"c-dual-views","label":"Dual projection engine","parent":"o-outcome-dev","value":0,"progress":0.5,"done":2,"total":4,"key":"c-dual-views"},{"id":"c-dual-views|svc-ci","label":"CI + automation","parent":"c-dual-views","value":0,"progress":0,"done":0,"total":1,"key":"c-dual-views|svc-ci"},{"id":"c-dual-views|svc-dual-views","label":"dual-views (generator)","parent":"c-dual-views","value":0,"progress":0.6666666666666666,"done":2,"total":3,"key":"c-dual-views|svc-dual-views"},{"id":"c-honest-rollups","label":"Honest roll-ups from real signals","parent":"o-outcome-dev","value":0,"progress":0.5,"done":1,"total":2,"key":"c-honest-rollups"},{"id":"c-honest-rollups|svc-ci","label":"CI + automation","parent":"c-honest-rollups","value":0,"progress":0,"done":0,"total":1,"key":"c-honest-rollups|svc-ci"},{"id":"c-honest-rollups|svc-dual-views","label":"dual-views (generator)","parent":"c-honest-rollups","value":0,"progress":1,"done":1,"total":1,"key":"c-honest-rollups|svc-dual-views"},{"id":"o-agent-flow","label":"Agentic delivery — agents execute leaves, humans approve","parent":"","value":0,"progress":0.5,"done":1,"total":2,"key":"o-agent-flow"},{"id":"c-alignment","label":"Agent alignment artifacts","parent":"o-agent-flow","value":0,"progress":1,"done":1,"total":1,"key":"c-alignment"},{"id":"c-alignment|svc-ci","label":"CI + automation","parent":"c-alignment","value":0,"progress":1,"done":1,"total":1,"key":"c-alignment|svc-ci"},{"id":"c-agent-tasks","label":"One task = one branch = one PR","parent":"o-agent-flow","value":0,"progress":0,"done":0,"total":1,"key":"c-agent-tasks"},{"id":"c-agent-tasks|svc-ci","label":"CI + automation","parent":"c-agent-tasks","value":0,"progress":0,"done":0,"total":1,"key":"c-agent-tasks|svc-ci"},{"id":"t-rename-stability","label":"Rename/move position stability","parent":"c-static-positions|svc-fractal-index","value":2,"progress":1,"done":1,"total":1,"key":"t-rename-stability"},{"id":"t-slot-engine","label":"Slot engine with customData identity","parent":"c-static-positions|svc-fractal-index","value":3,"progress":1,"done":1,"total":1,"key":"t-slot-engine"},{"id":"t-obsidian-smoke","label":"Live Obsidian smoke test","parent":"c-static-positions|svc-obsidian-plugin","value":2,"progress":0,"done":0,"total":1,"key":"t-obsidian-smoke"},{"id":"t-crossfilter","label":"Cross-view focus links","parent":"c-dual-views|svc-dual-views","value":2,"progress":0,"done":0,"total":1,"key":"t-crossfilter"},{"id":"t-storymap","label":"Story-map projection (Excalidraw)","parent":"c-dual-views|svc-dual-views","value":3,"progress":1,"done":1,"total":1,"key":"t-storymap"},{"id":"t-treemap","label":"Treemap projection (Plotly)","parent":"c-dual-views|svc-dual-views","value":3,"progress":1,"done":1,"total":1,"key":"t-treemap"},{"id":"t-gh-adapter","label":"GitHub sub-issue adapter","parent":"c-dual-views|svc-ci","value":2,"progress":0,"done":0,"total":1,"key":"t-gh-adapter"},{"id":"t-count-rollup","label":"Unweighted done-leaf roll-ups","parent":"c-honest-rollups|svc-dual-views","value":1,"progress":1,"done":1,"total":1,"key":"t-count-rollup"},{"id":"t-ci-refresh","label":"Regenerate views on issue close / PR merge","parent":"c-honest-rollups|svc-ci","value":2,"progress":0,"done":0,"total":1,"key":"t-ci-refresh"},{"id":"t-many-tomany","label":"Many-to-many capability↔service mapping","parent":"c-multi-view|svc-dual-views","value":2,"progress":1,"done":1,"total":1,"key":"t-many-tomany"},{"id":"t-projection-keys","label":"Shared key space across views","parent":"c-multi-view|svc-dual-views","value":1,"progress":1,"done":1,"total":1,"key":"t-projection-keys"},{"id":"t-third-view","label":"Third projection: coverage lens","parent":"c-multi-view|svc-ci","value":3,"progress":0,"done":0,"total":1,"key":"t-third-view"},{"id":"t-linkclick-hook","label":"onLinkClickHook zoom-into-pod","parent":"c-fractal-recursion|svc-fractal-index","value":2,"progress":0,"done":0,"total":1,"key":"t-linkclick-hook"},{"id":"t-pod-embeds","label":"Recursive pod embeds","parent":"c-fractal-recursion|svc-fractal-index","value":3,"progress":1,"done":1,"total":1,"key":"t-pod-embeds"},{"id":"t-agents-md","label":"AGENTS.md conventions","parent":"c-alignment|svc-ci","value":1,"progress":1,"done":1,"total":1,"key":"t-agents-md"},{"id":"t-branch-protection","label":"Branch protection + required checks","parent":"c-agent-tasks|svc-ci","value":2,"progress":0,"done":0,"total":1,"key":"t-branch-protection"}]};
const byId = new Map(MODEL.data.map(d => [d.id, d]));
const parentOf = (id) => byId.get(id)?.parent ?? null;
const ancestry = (id) => { const out = []; let k = id; while (k) { out.unshift(k); k = parentOf(k); } return out; };
const descendants = (id) => { const out = []; const walk = (n) => { for (const d of MODEL.data) if (d.parent === n) { out.push(d.id); walk(d.id); } }; walk(id); return out; };

const focused = new URLSearchParams(location.search).get("focus");
const keep = focused ? new Set([...ancestry(focused), focused, ...descendants(focused)]) : null;
const colorOf = (d) => (keep && !keep.has(d.id) ? "#ececec" : ramp(d.progress));

function ramp(p) {
  // red → amber → green on rolled-up leaf progress
  const stops = [[0,[220,38,38]],[0.5,[245,158,11]],[1,[46,125,50]]];
  for (let i = 1; i < stops.length; i++) {
    if (p <= stops[i][0]) {
      const [p0,c0] = stops[i-1], [p1,c1] = stops[i];
      const t = (p - p0) / (p1 - p0 || 1);
      const c = c0.map((v,j) => Math.round(v + t * (c1[j] - v)));
      return "rgb(" + c.join(",") + ")";
    }
  }
  return "rgb(46,125,50)";
}

document.getElementById("overall").textContent =
  MODEL.overall.done + " / " + MODEL.overall.total + " leaf tasks done (" +
  Math.round(100 * MODEL.overall.done / Math.max(1, MODEL.overall.total)) + "%)";

const trace = {
  type: "treemap",
  ids: MODEL.data.map(d => d.id),
  labels: MODEL.data.map(d => d.label),
  parents: MODEL.data.map(d => d.parent),
  values: MODEL.data.map(d => d.value),
  branchvalues: "remainder",
  marker: { colors: MODEL.data.map(colorOf), line: { width: 2 } },
  texttemplate: "%{label}",
  hovertemplate: "%{label} — %{customdata[0]} / %{customdata[1]} leaf tasks done · progress %{text}<extra></extra>",
  customdata: MODEL.data.map(d => [d.done, d.total]),
  pathbar: { visible: true },
  level: "",
  tiling: { packing: "squarify" },
  maxdepth: 3,
};

Plotly.newPlot("chart", [trace], {
  margin: { t: 30, l: 0, r: 0, b: 0 },
  font: { family: "Segoe UI, Helvetica, sans-serif", size: 13 },
  paper_bgcolor: "#fafafa",
}, { displayModeBar: false, responsive: true });

document.getElementById("chart").on("plotly_treemapclick", (ev) => {
  const pt = ev.points?.[0];
  if (!pt) return;
  const chain = ancestry(pt.id).map(id => byId.get(id)?.label).join(" → ");
  const el = document.getElementById("chain");
  el.style.display = "block";
  el.innerHTML = "<b>" + escHtml(chain) + "</b> &nbsp; " +
    "<a href='?focus=" + encodeURIComponent(pt.id) + "'>focus this subtree</a> · " +
    "<a href='" + location.pathname + "'>clear</a> · " +
    "<span style='color:#999'>story-map key: <code>" + escHtml(pt.id) + "</code></span>";
});
function escHtml(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

/* live search: dim tiles whose label doesn't match (keep their ancestors lit) */
const searchBox = document.getElementById("search");
searchBox.addEventListener("input", () => {
  const q = searchBox.value.trim().toLowerCase();
  const matches = q ? new Set() : null;
  if (q) {
    for (const d of MODEL.data) {
      if (d.label.toLowerCase().includes(q)) {
        matches.add(d.id);
        for (const a of ancestry(d.id)) matches.add(a);
      }
    }
  }
  Plotly.restyle("chart", {
    "marker.colors": [MODEL.data.map(d => {
      if (matches && !matches.has(d.id)) return "#ececec";
      if (keep && !keep.has(d.id)) return "#ececec";
      return ramp(d.progress);
    })],
  });
});
</script>
</body>
</html>
